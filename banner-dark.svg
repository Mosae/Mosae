<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 60) rotate(140) scale(420 220)">
      <stop stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name {
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        font-weight: 800;
        font-size: 72px;
        letter-spacing: 0.5px;
        fill: #F8FAFC;
        paint-order: stroke;
        stroke: rgba(0,0,0,0.35);
        stroke-width: 2px;
      }
      .role {
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        font-weight: 500;
        font-size: 28px;
        fill: #CBD5E1;
      }
      .meta {
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #93C5FD;
      }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bgDark)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <g opacity="0.35">
    <circle cx="1040" cy="300" r="220" fill="#1E3A8A"/>
    <circle cx="1160" cy="40" r="140" fill="#2563EB"/>
  </g>

  <text x="80" y="150" class="name">Mosae Litsoane</text>
  <text x="80" y="200" class="role">Software Engineer " Builder " Problem Solver</text>
  <text x="80" y="250" class="meta">Open to collaboration on impactful products</text>
</svg>
